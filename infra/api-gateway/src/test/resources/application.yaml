spring:
  main:
    banner-mode: off
    log-startup-info: false

  cloud:
    config:
      enabled: false

    discovery:
      locator:
        enabled: false

eureka:
  client:
    enabled: false

controllers:
  categories:
    base-path: /api/categories

  products:
    base-path: /api/products
    search: /search
    category: /category/{categoryId}

  inventory:
    base-path: /api/inventory
    reserve: /reserve
    release: /release

  order:
    base-path: /api/orders
    by-email: /by-email
    by-id: /{id}

app:
  security:
    users:
      - username: ivan
        password: ivan
        roles:
          - USER

      - username: anna
        password: anna
        roles:
          - USER
          - ADMIN