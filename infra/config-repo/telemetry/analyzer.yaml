spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/telemetry_analyzer
    username: dbuser
    password: 12345
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

kafka:
  consumer:
    attempt-timeout-millis: 1000
    hub:
      properties:
        bootstrap.servers: localhost:9092
        group.id: analyzer-hub-group
        client.id: analyzer-hub-consumer
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value.deserializer: ru.practicum.deserialization.HubEventDeserializer
        enable.auto.commit: false
      topics:
        - telemetry.hubs.v1
    snapshot:
      properties:
        bootstrap.servers: localhost:9092
        group.id: analyzer-snapshot-group
        client.id: analyzer-snapshot-consumer
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value.deserializer: ru.practicum.deserialization.SensorsSnapshotDeserializer
        enable.auto.commit: false
      topics:
        - telemetry.snapshots.v1