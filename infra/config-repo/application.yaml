server:
  port: 0

spring:
  main:
    banner-mode: off
    log-startup-info: false

logging:
  level:
    ru.yandex.practicum.telemetry: WARN
    org:
      springframework: ERROR
      apache.kafka: WARN

kafka:
  bootstrap-servers: "localhost:9092"

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

controllers:
  categories:
    base-path: /api/categories
  products:
    base-path: /api/products
    search: /search
    category: /category/{categoryId}
  inventory:
    base-path: /api/inventory
    reserve: /reserve
    release: /release
  order:
    base-path: /api/orders
    by-email: /by-email