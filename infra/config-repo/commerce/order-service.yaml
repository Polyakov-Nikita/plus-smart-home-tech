spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/order_db
    username: dbuser
    password: 12345
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 2000
            loggerLevel: none
          inventory-service:
            loggerLevel: basic
      circuitbreaker:
        enabled: true

  resilience4j:
    circuitbreaker:
      configs:
        default:
          sliding-window-size: 5
          failure-rate-threshold: 50
          wait-duration-in-open-state: 10s
          permitted-number-of-calls-in-half-open-state: 3
    timelimiter:
      configs:
        default:
          timeout-duration: 3s

  logging:
    level:
      ru.yandex.practicum.order.feign.InventoryClient: DEBUG